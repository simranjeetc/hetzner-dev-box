#cloud-config
# Personal Cloud Dev Box — first-boot provisioning
# Installs: base tools, Java, Node, Python, Go, Docker, opencode, Claude Code
# Creates non-root user 'dev', hardens SSH, enables firewall.

users:
  - name: dev
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    # NOTE: cloud-init auto-copies the server's ssh_keys (from Terraform) to this user
    # via the default flow when 'ssh_redirect_user' is not set. We rely on Terraform's
    # ssh_keys being applied to root; below we also propagate to dev.

package_update: true
# package_upgrade intentionally DISABLED: a base-image dev box does not need a
# full apt upgrade on every rebuild, and it was pulling a kernel package whose
# needrestart hook opened an interactive whiptail "Pending kernel upgrade"
# dialog (Failed to open terminal / debconf giving up). Targeted installs below
# run fully non-interactive instead.
package_upgrade: false

packages:
  - build-essential
  - curl
  - wget
  - git
  - zsh
  - unzip
  - zip
  - htop
  - tmux
  - ca-certificates
  - gnupg
  - lsb-release
  - ufw
  - fail2ban
  - fontconfig
  - locales

write_files:
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin prohibit-password
      X11Forwarding no
      ClientAliveInterval 60
      ClientAliveCountMax 3
      TCPKeepAlive yes
      LoginGraceTime 30

  - path: /opt/provision.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euxo pipefail

      # --- Non-interactive apt + robustness preamble --------------------------
      # This script runs from cloud-init's runcmd with NO controlling terminal.
      # Any package whose postinst/needrestart hook tries to prompt (e.g. the
      # "Pending kernel upgrade" whiptail dialog) will "Failed to open terminal"
      # and pollute the log; historically this ran alongside a full apt upgrade
      # that pulled a new kernel. We force EVERY apt op non-interactive and make
      # needrestart apply restarts automatically (mode 'a') so nothing blocks.
      export DEBIAN_FRONTEND=noninteractive
      export NEEDRESTART_MODE=a
      export NEEDRESTART_SUSPEND=1
      # Belt-and-suspenders: pin needrestart to automatic restarts on disk too,
      # in case a sub-shell drops the env var.
      if [ -d /etc/needrestart ]; then
        echo "\$nrconf{restart} = 'a';" > /etc/needrestart/needrestart.conf.d/50-autorestart.conf 2>/dev/null || \
          { mkdir -p /etc/needrestart/needrestart.conf.d; echo "\$nrconf{restart} = 'a';" > /etc/needrestart/needrestart.conf.d/50-autorestart.conf; }
      fi
      # Default apt-get flags: keep existing config files, never prompt on conffile
      # conflicts. Applied via a helper so every install/upgrade is consistent.
      APT_OPTS=(-y -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold)
      apti() { apt-get "${APT_OPTS[@]}" install "$@"; }
      # CRITICAL: cloud-init runcmd runs with HOME unset. Several vendored
      # installers (zoxide's install.sh line 77: "${HOME}/.local/bin", uv, etc.)
      # dereference $HOME unconditionally; under `set -u` an unset HOME aborts the
      # ENTIRE script — this is what previously killed provisioning right before
      # the `sudo -iu dev` block (herdr, code-server, dotfiles, chsh all skipped).
      export HOME="${HOME:-/root}"

      # --- Locale baseline ---
      # Fresh rebuilds can reject client-sent UTF-8 locales, which breaks manpath
      # and prompt glyph rendering. Keep this deterministic across dev-up cycles.
      locale-gen en_US.UTF-8
      update-locale LANG=en_US.UTF-8 LC_CTYPE=en_US.UTF-8

      # --- Persistent DATA volume (/data) — idempotent, NON-destructive ---
      # The Hetzner volume "personal-dev-data" is attached separately (Terraform
      # hcloud_volume_attachment). It holds repos, uncommitted work, dotfiles,
      # gh token, GitHub SSH key, herdr state. Toolchains live on the ephemeral
      # SSD; only /data is persistent. NEVER reformat an already-populated volume.
      DATA_DEV=""
      # Prefer the stable by-id path Hetzner exposes for every attached volume.
      for d in /dev/disk/by-id/scsi-0HC_Volume_*; do
        [ -e "$d" ] && DATA_DEV="$d" && break
      done
      if [ -n "$DATA_DEV" ]; then
        REAL_DEV="$(readlink -f "$DATA_DEV")"
        # Only mkfs if the device has NO filesystem yet (fresh volume). An
        # already-formatted/populated volume MUST be preserved as-is.
        if ! blkid "$REAL_DEV" >/dev/null 2>&1; then
          mkfs.ext4 -F "$REAL_DEV"
        fi
        mkdir -p /data
        # Mount by UUID for stability across device renames.
        DATA_UUID="$(blkid -s UUID -o value "$REAL_DEV")"
        if ! grep -q "$DATA_UUID" /etc/fstab; then
          echo "UUID=$DATA_UUID /data ext4 discard,nofail,defaults 0 2" >> /etc/fstab
        fi
        mountpoint -q /data || mount /data
        chown dev:dev /data
      fi

      # --- 2GB swapfile (cushion for the 4GB machine tiers) ---
      # python/node dev fits in 4GB, but frontend bundles or parallel tooling
      # can spike past RAM; swap absorbs it instead of OOM-killing sessions.
      # Harmless on the 8GB tiers. Ephemeral (OS disk) — recreated on every
      # rebuild, idempotent within a boot.
      if ! swapon --show | grep -q '/swapfile'; then
        fallocate -l 2G /swapfile
        chmod 600 /swapfile
        mkswap /swapfile >/dev/null
        swapon /swapfile
      fi
      grep -q '^/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab

      # --- Persistent SSH HOST keys on /data (stable server identity) ---
      # cloud-init generates fresh host keys on every NEW instance (by design,
      # so images don't share keys across clones). Since dev-down/dev-up fully
      # destroys and recreates the server (only /data + the reserved IP
      # survive), the host key used to change on every rebuild even though the
      # IP stayed the same — this is what caused SSH clients to reject the box
      # every time with "REMOTE HOST IDENTIFICATION HAS CHANGED" (or refuse
      # outright), requiring a manual `ssh-keygen -R <ip>` each cycle. Fix:
      # persist the host keys to /data once, then restore them on every boot
      # BEFORE sshd is (re)started below, so the box's identity never changes.
      mkdir -p /data/ssh/host_keys
      chmod 700 /data/ssh/host_keys
      if [ ! -f /data/ssh/host_keys/ssh_host_ed25519_key ]; then
        # First boot ever (or /data lost): adopt whatever sshd/cloud-init just
        # generated as the permanent identity going forward.
        cp -a /etc/ssh/ssh_host_*_key /etc/ssh/ssh_host_*_key.pub /data/ssh/host_keys/
      else
        # Rebuild: restore the persisted identity over the fresh ones cloud-init
        # just generated for this new instance.
        cp -a /data/ssh/host_keys/ssh_host_*_key /data/ssh/host_keys/ssh_host_*_key.pub /etc/ssh/
      fi
      chown root:root /etc/ssh/ssh_host_*_key /etc/ssh/ssh_host_*_key.pub
      chmod 600 /etc/ssh/ssh_host_*_key
      chmod 644 /etc/ssh/ssh_host_*_key.pub
      systemctl restart ssh

      # --- Tailscale (private tailnet for phone/tablet access) ---
      # Gives the box a stable private address (100.x.y.z + MagicDNS name) on a
      # zero-config WireGuard overlay, reachable ONLY from authenticated
      # devices in the tailnet — never exposed on the public internet. Served
      # over the tailnet: Tailscale SSH (drop-in ssh access from any tailnet
      # device, incl. phone SSH clients) and the opencode web UI (the
      # `tailscale serve` HTTPS proxy fronting the opencode-serve systemd
      # --user unit defined in the dev section below).
      # Identity persistence mirrors the SSH host-key block above: node state
      # lives on /data, so after the ONE-TIME first auth the box rejoins every
      # rebuild as the SAME node (same name + same 100.x IP), no re-auth.
      # NO secrets in this repo: the auth flow is interactive-once (URL), the
      # resulting node key is just machine identity, stored on /data.
      if ! command -v tailscale >/dev/null 2>&1; then
        curl -fsSL https://tailscale.com/install.sh | sh
      fi
      systemctl stop tailscaled
      mkdir -p /data/tailscale-state
      chmod 700 /data/tailscale-state
      if [ -f /data/tailscale-state/tailscaled.state ]; then
        # Rebuild: restore the persisted node identity over the fresh state
        # the package install just generated, then rejoin silently (with
        # restored node credentials this needs no auth) and refresh /data.
        rm -rf /var/lib/tailscale/*
        cp -a /data/tailscale-state/. /var/lib/tailscale/
        systemctl start tailscaled
        tailscale up --ssh --hostname=personal-dev || true
        # tailscale serve config lives in tailscaled.state, so the opencode
        # web-UI proxy survives rebuilds automatically; re-assert it anyway to
        # self-heal if it was ever missing (idempotent, no-op when set).
        tailscale serve --bg http://127.0.0.1:4096 || true
        cp -a /var/lib/tailscale/. /data/tailscale-state/
      else
        # First boot ever (or /data lost): authenticate ONCE interactively.
        # The login URL is written to /var/log/tailscale-auth.log; tailscaled
        # completes the login whenever that URL is visited in a browser (the
        # CLI dying does not cancel a pending login). Once joined: publish the
        # opencode web UI and persist the state so future rebuilds never auth.
        systemctl start tailscaled
        nohup sh -c '
          tailscale up --ssh --hostname=personal-dev
          for i in $(seq 1 90); do
            sleep 10
            if tailscale ip >/dev/null 2>&1; then
              tailscale serve --bg http://127.0.0.1:4096 || true
              cp -a /var/lib/tailscale/. /data/tailscale-state/
              break
            fi
          done
        ' >/var/log/tailscale-auth.log 2>&1 &
      fi

      # --- CRITICAL: ensure dev owns its own home (cloud-init write_files can
      # create /home/dev as root before the users module; fix ownership first) ---
      chown -R dev:dev /home/dev

      # --- Propagate root's authorized_keys to dev (all device keys) ---
      mkdir -p /home/dev/.ssh
      if [ -f /root/.ssh/authorized_keys ]; then
        cp /root/.ssh/authorized_keys /home/dev/.ssh/authorized_keys
      fi
      # Append persisted, hand-added keys from /data so they survive rebuilds.
      # (Real-file append — never a symlink — so terraform device keys are never shadowed,
      #  and login still works if /data is ever unmounted.)
      if [ -f /data/ssh/authorized_keys_extra ]; then
        cat /data/ssh/authorized_keys_extra >> /home/dev/.ssh/authorized_keys
      fi
      chown -R dev:dev /home/dev/.ssh
      chmod 700 /home/dev/.ssh
      chmod 600 /home/dev/.ssh/authorized_keys || true

      # --- OPTIONAL emergency console password (break-glass, second factor) ---
      # Hetzner web console (getty on ttyS0/tty1) shows `login:` but BOTH root and
      # dev are password-locked (dev via cloud-init lock_passwd default, root via
      # base image), so no credential works. To enable console login in an emergency,
      # drop a PRE-HASHED password line into the persistent file below (NEVER in git).
      # Format is chpasswd -e input:   dev:$6$salt$hash
      # Generate the hash off-box:  openssl passwd -6   (or: mkpasswd -m sha-512)
      # This does NOT weaken sshd: PasswordAuthentication stays `no`, so this password
      # is usable ONLY at the Hetzner panel console, which is itself gated by your
      # Hetzner account login (true second factor). Targets dev (has NOPASSWD sudo);
      # root stays locked.
      if [ -f /data/console/console_passwd.hash ]; then
        chpasswd -e < /data/console/console_passwd.hash
      fi

      # --- Docker ---
      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      chmod a+r /etc/apt/keyrings/docker.gpg
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" > /etc/apt/sources.list.d/docker.list
      apt-get update
      apti docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      usermod -aG docker dev

      # --- GitHub CLI (gh) via official apt repo ---
      curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
      chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
      apt-get update
      apti gh

      # --- Persistent gh config dir on /data + global GH_CONFIG_DIR ---
      # gh stores its auth token in $GH_CONFIG_DIR; pin it to /data so the token
      # survives destroy/recreate. Env-var approach (no symlink). Do NOT run
      # `gh auth login` here — the user completes the device flow manually.
      mkdir -p /data/gh-config
      chmod 700 /data/gh-config
      chown dev:dev /data/gh-config
      cat > /etc/profile.d/10-gh.sh <<'GHEOF'
      export GH_CONFIG_DIR=/data/gh-config
      GHEOF
      chmod 644 /etc/profile.d/10-gh.sh

      # --- Persistent Claude Code config dir on /data + CLAUDE_CONFIG_DIR ---
      # Claude Code's own config lives in $CLAUDE_CONFIG_DIR (official override,
      # same mechanism as GH_CONFIG_DIR above). Pin it to /data so settings,
      # session history, and credentials survive destroy/recreate.
      mkdir -p /data/claude-config
      chmod 700 /data/claude-config
      chown dev:dev /data/claude-config
      cat > /etc/profile.d/10-claude.sh <<'CLAUDEEOF'
      export CLAUDE_CONFIG_DIR=/data/claude-config
      CLAUDEEOF
      chmod 644 /etc/profile.d/10-claude.sh

      # --- Also export GH/CLAUDE config dirs via /etc/zsh/zshenv ---
      # WHY: non-interactive, non-login zsh shells (what opencode and other
      # agent harnesses spawn per command) source NEITHER /etc/profile.d/*.sh
      # NOR ~/.zshrc — zsh only reads zshenv in that context. Without these
      # exports, gh/claude appear unauthenticated inside agent shells even
      # though valid tokens exist on /data. Ubuntu ships /etc/zsh/zshenv (sets
      # PATH) — append, do NOT overwrite. Grep-guarded so rebuilds stay clean.
      touch /etc/zsh/zshenv
      chmod 644 /etc/zsh/zshenv
      grep -q "GH_CONFIG_DIR" /etc/zsh/zshenv 2>/dev/null || \
        echo 'export GH_CONFIG_DIR=/data/gh-config' >> /etc/zsh/zshenv
      grep -q "CLAUDE_CONFIG_DIR" /etc/zsh/zshenv 2>/dev/null || \
        echo 'export CLAUDE_CONFIG_DIR=/data/claude-config' >> /etc/zsh/zshenv

      # --- Persistent GitHub SSH key on /data (NEVER overwrite existing key) ---
      mkdir -p /data/ssh
      chmod 700 /data/ssh
      chown dev:dev /data/ssh
      # Generate ONLY if the persistent key is absent (guard rebuilds).
      if [ ! -f /data/ssh/id_ed25519_github ]; then
        sudo -u dev ssh-keygen -t ed25519 -C "hetzner-dev-box-github" -f /data/ssh/id_ed25519_github -N ""
      fi
      chown dev:dev /data/ssh/id_ed25519_github /data/ssh/id_ed25519_github.pub
      chmod 600 /data/ssh/id_ed25519_github
      chmod 644 /data/ssh/id_ed25519_github.pub

      # --- dev's ~/.ssh: keepalive defaults + github.com config block + known_hosts (idempotent) ---
      mkdir -p /home/dev/.ssh
      # Client-side SSH keepalive: write Host * block first so it acts as default.
      # Placed before the github.com block to ensure it is the first matching Host.
      if ! grep -qE "^[[:space:]]*Host[[:space:]]+\*[[:space:]]*$" /home/dev/.ssh/config 2>/dev/null; then
        printf 'Host *\n    ServerAliveInterval 60\n    ServerAliveCountMax 3\n' >> /home/dev/.ssh/config
      fi
      # Match Host line with optional leading whitespace so the guard is reliable.
      if ! grep -qE "^[[:space:]]*Host[[:space:]]+github.com" /home/dev/.ssh/config 2>/dev/null; then
        printf 'Host github.com\n    HostName github.com\n    User git\n    IdentityFile /data/ssh/id_ed25519_github\n    IdentitiesOnly yes\n' >> /home/dev/.ssh/config
      fi
      touch /home/dev/.ssh/known_hosts
      if ! ssh-keygen -F github.com -f /home/dev/.ssh/known_hosts >/dev/null 2>&1; then
        ssh-keyscan github.com >> /home/dev/.ssh/known_hosts 2>/dev/null || true
      fi
      chown -R dev:dev /home/dev/.ssh
      chmod 700 /home/dev/.ssh
      chmod 600 /home/dev/.ssh/config
      chmod 644 /home/dev/.ssh/known_hosts

      # --- Go (official tarball, latest stable) ---
      GO_VER="1.23.4"
      curl -fsSL "https://go.dev/dl/go${GO_VER}.linux-amd64.tar.gz" -o /tmp/go.tgz
      rm -rf /usr/local/go && tar -C /usr/local -xzf /tmp/go.tgz
      echo 'export PATH=$PATH:/usr/local/go/bin:$HOME/go/bin' >> /home/dev/.bashrc

      # --- Editor stack (terminal dev tooling, root install to /usr/local/bin + /opt) ---
      # nvim>=0.10, lazygit, fzf, ripgrep, fd, zoxide, eza, bat. Idempotent.
      # tmux is already installed via the packages: list above (not duplicated here).
      # Binaries land on /usr/local/bin (already on PATH). No dotfiles/plugins here.
      apti ripgrep fd-find bat
      # Ubuntu ships fdfind/batcat; expose canonical names on PATH.
      ln -sf "$(command -v fdfind)" /usr/local/bin/fd
      ln -sf "$(command -v batcat)" /usr/local/bin/bat

      # Neovim (official tarball -> /opt/nvim, symlinked; apt's is too old).
      NVIM_TGZ="nvim-linux-x86_64.tar.gz"
      curl -fsSL "https://github.com/neovim/neovim/releases/latest/download/${NVIM_TGZ}" -o /tmp/nvim.tgz \
        || curl -fsSL "https://github.com/neovim/neovim/releases/download/v0.10.4/${NVIM_TGZ}" -o /tmp/nvim.tgz
      rm -rf /opt/nvim && mkdir -p /opt/nvim
      tar -C /opt/nvim --strip-components=1 -xzf /tmp/nvim.tgz
      ln -sf /opt/nvim/bin/nvim /usr/local/bin/nvim

      # lazygit (GitHub release binary; pinned fallback if API detection flaky).
      LAZYGIT_VER="$(curl -fsSL https://api.github.com/repos/jesseduffield/lazygit/releases/latest | grep -oP '"tag_name": *"v\K[0-9.]+' | head -1)"
      LAZYGIT_VER="${LAZYGIT_VER:-0.44.1}"
      curl -fsSL "https://github.com/jesseduffield/lazygit/releases/download/v${LAZYGIT_VER}/lazygit_${LAZYGIT_VER}_Linux_x86_64.tar.gz" -o /tmp/lazygit.tgz
      tar -C /tmp -xzf /tmp/lazygit.tgz lazygit
      install -m 0755 /tmp/lazygit /usr/local/bin/lazygit

      # fzf (GitHub release binary; pinned fallback).
      FZF_VER="$(curl -fsSL https://api.github.com/repos/junegunn/fzf/releases/latest | grep -oP '"tag_name": *"v\K[0-9.]+' | head -1)"
      FZF_VER="${FZF_VER:-0.56.3}"
      curl -fsSL "https://github.com/junegunn/fzf/releases/download/v${FZF_VER}/fzf-${FZF_VER}-linux_amd64.tar.gz" -o /tmp/fzf.tgz
      tar -C /tmp -xzf /tmp/fzf.tgz fzf
      install -m 0755 /tmp/fzf /usr/local/bin/fzf

      # eza (GitHub release binary; pinned fallback).
      EZA_VER="$(curl -fsSL https://api.github.com/repos/eza-community/eza/releases/latest | grep -oP '"tag_name": *"v\K[0-9.]+' | head -1)"
      EZA_VER="${EZA_VER:-0.20.14}"
      curl -fsSL "https://github.com/eza-community/eza/releases/download/v${EZA_VER}/eza_x86_64-unknown-linux-gnu.tar.gz" -o /tmp/eza.tgz
      tar -C /tmp -xzf /tmp/eza.tgz
      install -m 0755 /tmp/eza /usr/local/bin/eza

      # zoxide (official installer -> /usr/local/bin).
      curl -fsSL https://raw.githubusercontent.com/ajeetdsouza/zoxide/main/install.sh | bash -s -- --bin-dir /usr/local/bin

      # --- Everything below runs AS dev ---
      sudo -iu dev bash <<'DEVEOF'
      # NOTE: no 'set -u' — SDKMAN/nvm init scripts reference unbound vars and
      # would abort the whole provision under -u. Keep -e -x -o pipefail only.
      set -exo pipefail

      # SDKMAN (Java + Maven + Gradle)
      curl -s "https://get.sdkman.io" | bash
      set +u; source "$HOME/.sdkman/bin/sdkman-init.sh"; set +u
      set +u
      sdk install java 21.0.5-tem
      sdk install maven
      sdk install gradle

      # NVM (Node)
      curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
      export NVM_DIR="$HOME/.nvm"
      set +u
      source "$NVM_DIR/nvm.sh"
      nvm install --lts
      nvm alias default 'lts/*'

      # Python via uv (fast, modern)
      curl -LsSf https://astral.sh/uv/install.sh | sh

      # opencode (pinned; upgrades are a deliberate, separate action — see RECOVERY.md)
      # Version is read from the persistent /data version file so rebuilds are
      # deterministic. On a truly-fresh /data the file is absent, so the
      # `2>/dev/null || echo 1.18.6` fallback pins the last-known-good default;
      # the migrate_or_link block below then seeds the file for next time.
      OPENCODE_VERSION="$(cat /data/opencode-config/OPENCODE_VERSION 2>/dev/null || echo 1.18.6)"
       # Pass the version as a --version FLAG to the installer. A prefix like
       # `VERSION=X curl ... | bash` only sets VERSION for curl, NOT the
       # downstream bash that runs the installer, so the pin was a no-op and
       # latest got installed. The install script parses -v/--version (and
       # $VERSION env); the flag is unambiguous, so we use it.
       curl -fsSL https://opencode.ai/install | bash -s -- --version "$OPENCODE_VERSION"

      # Claude Code CLI (Anthropic's coding agent). Channel/version is read from
      # the persistent /data version file (mirrors the opencode pattern above) so
      # rebuilds are deterministic — defaults to the "stable" release channel
      # (not "latest") to avoid picking up a same-day regression on every
      # rebuild. Bump/pin explicitly by editing
      # /data/claude-config/CLAUDE_CODE_VERSION (accepts "stable", "latest", or
      # an exact version like "2.1.89") — see RECOVERY.md. Native installer
      # (no Node.js dependency); binary lands in ~/.local/bin, already on PATH
      # via /etc/profile.d/00-dev-toolchains.sh below. CLAUDE_CONFIG_DIR (set by
      # /etc/profile.d/10-claude.sh, sourced by this login shell) already points
      # at /data/claude-config, so credentials/settings/session history persist
      # across rebuilds.
      CLAUDE_CODE_VERSION="$(cat /data/claude-config/CLAUDE_CODE_VERSION 2>/dev/null || echo stable)"
      curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"

      # herdr (terminal workspace manager for AI agents) — single static
      # binary to ~/.local/bin/herdr, no root. State/config lives ENTIRELY
      # under ~/.config/herdr (sessions, sockets, session.json persistence).
      command -v herdr >/dev/null 2>&1 || curl -fsSL https://herdr.dev/install.sh | sh

      # code-server (VS Code in the browser) — ON-DEMAND only.
      # Installed system-wide (/usr/bin/code-server). A systemd --user unit is
      # created below but DELIBERATELY NOT enabled at boot: it must be started
      # manually (`systemctl --user start code-server`) so it consumes no RAM
      # by default. Strong random password on first install only (idempotent).
      command -v code-server >/dev/null 2>&1 || curl -fsSL https://code-server.dev/install.sh | sh
      # Password-preservation guard across rebuilds: if the persistent /data copy
      # already has a config.yaml (with its password), that wins — do NOT generate
      # a fresh random password. Only generate when NEITHER the home config NOR the
      # /data config exists (true first boot). The migrate-or-link block further
      # below then symlinks ~/.config/code-server -> /data/code-server/config.
      mkdir -p "$HOME/.config/code-server"
      if [ ! -f "$HOME/.config/code-server/config.yaml" ] && [ ! -f /data/code-server/config/config.yaml ]; then
        CSPW="$(openssl rand -base64 24 | tr -d /+= | cut -c1-32)"
        cat > "$HOME/.config/code-server/config.yaml" <<CSEOF
      bind-addr: 0.0.0.0:8443
      auth: password
      password: $CSPW
      cert: false
      CSEOF
        chmod 600 "$HOME/.config/code-server/config.yaml"
      fi
      # systemd --user unit — created but NOT enabled (manual start/stop).
      mkdir -p "$HOME/.config/systemd/user"
      cat > "$HOME/.config/systemd/user/code-server.service" <<CSEOF
      [Unit]
      Description=code-server (on-demand)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=exec
      ExecStart=/usr/bin/code-server --config %h/.config/code-server/config.yaml --idle-timeout-seconds 1800
      Restart=on-failure

      [Install]
      WantedBy=default.target
      CSEOF
      systemctl --user daemon-reload 2>/dev/null || true

      # opencode serve (web UI/API server) — ALWAYS ON at boot, for mobile
      # access over the tailnet. The iPhone reaches it at
      # https://personal-dev.<tailnet>.ts.net/ via the `tailscale serve`
      # HTTPS proxy (see the tailscale block in the root section). Unlike
      # code-server above it IS enabled: it is the persistent access path and
      # is lightweight. Binds 127.0.0.1 ONLY — never on the public internet;
      # tailnet devices get it exclusively through the tailscale serve proxy.
      # Sessions/auth live in ~/.local/share/opencode (-> /data/opencode-share,
      # migrated below), so web-UI and TUI sessions share one persistent store.
      cat > "$HOME/.config/systemd/user/opencode-serve.service" <<'OSEOF'
      [Unit]
      Description=opencode serve (web UI; tailnet-only via tailscale serve)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=exec
      ExecStart=%h/.opencode/bin/opencode serve --hostname 127.0.0.1 --port 4096
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=default.target
      OSEOF
      systemctl --user daemon-reload 2>/dev/null || true
      systemctl --user enable opencode-serve 2>/dev/null || true
      # Best-effort start for THIS boot; linger (enabled near the end of this
      # script) + enable above guarantee auto-start on every subsequent boot.
      systemctl --user start opencode-serve 2>/dev/null || true

      # --- Personal dotfiles (simranjeetc/dotfiles) — copy-based setup.sh ---
      # Applies zsh/nvim/oh-my-zsh-custom config. Requires the github.com SSH
      # config + known_hosts already written by the root section above (so the
      # SSH clone authenticates and does not hang on host-key prompt). Fully
      # idempotent: guards on repo dir, ~/.oh-my-zsh, and font presence.
      # github.com is already in ~/.ssh/known_hosts (root block), but re-guard
      # here to be safe if this block is ever run standalone.
      mkdir -p "$HOME/.ssh"
      if ! ssh-keygen -F github.com -f "$HOME/.ssh/known_hosts" >/dev/null 2>&1; then
        ssh-keyscan github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
      fi
      # 1) Clone the dotfiles repo (guard: skip if already present).
      [ -d "$HOME/dotfiles" ] || git clone git@github.com:simranjeetc/dotfiles.git "$HOME/dotfiles" || echo "WARN: dotfiles clone failed (SSH key may not be registered on GitHub yet)"
      # 2) oh-my-zsh unattended — no chsh, no zshrc clobber (setup.sh owns zshrc).
      if [ ! -d "$HOME/.oh-my-zsh" ]; then
        RUNZSH=no CHSH=no KEEP_ZSHRC=yes sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
      fi
      # 3) Back up any pre-existing zshrc exactly once (before setup.sh overwrites).
      [ -f "$HOME/.zshrc" ] && [ ! -f "$HOME/.zshrc.pre-dotfiles" ] && cp "$HOME/.zshrc" "$HOME/.zshrc.pre-dotfiles"
      # 4) Run the repo's copy-based installer (copies zshrc/nvim/oh-my-zsh-custom).
      [ -d "$HOME/dotfiles" ] && { cd "$HOME" && bash "$HOME/dotfiles/setup.sh" || echo "WARN: dotfiles setup.sh non-zero"; }
      # 5) JetBrainsMono Nerd Font (guard: skip if already installed).
      if ! fc-list 2>/dev/null | grep -qi "JetBrainsMono Nerd Font"; then
        mkdir -p "$HOME/.local/share/fonts"
        curl -fsSL https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.zip -o /tmp/JetBrainsMono.zip || echo "WARN: nerd font download failed"
        [ -f /tmp/JetBrainsMono.zip ] && unzip -o /tmp/JetBrainsMono.zip -d "$HOME/.local/share/fonts" >/dev/null
        rm -f /tmp/JetBrainsMono.zip
        fc-cache -f "$HOME/.local/share/fonts" >/dev/null 2>&1 || true
      fi

      # --- Persist herdr + code-server state onto /data (symlink pattern) ---
      # These dirs must survive `terraform destroy` (only /data persists). We
      # migrate any real home dir onto /data (first boot) then replace it with a
      # symlink; on rebuild /data already has the content so we just symlink.
      # Idempotent + non-destructive: if BOTH home and /data have real content,
      # the /data copy wins (source of truth) and home is backed up, never lost.
      #   ~/.config/herdr            -> /data/herdr-config
      #   ~/.config/code-server      -> /data/code-server/config
      #   ~/.local/share/code-server -> /data/code-server/share
      # code-server is NOT running at this point (unit created, not started), so
      # it is safe to move its dirs.
      migrate_or_link() {
        SRC="$1"; DST="$2"; TS="$(date +%Y%m%d-%H%M%S)"
        mkdir -p "$(dirname "$SRC")" "$(dirname "$DST")"
        if [ -L "$SRC" ]; then
          [ "$(readlink "$SRC")" = "$DST" ] && return 0
          rm -f "$SRC"
        fi
        if [ -d "$SRC" ] && [ ! -L "$SRC" ]; then
          if [ ! -e "$DST" ] || [ -z "$(ls -A "$DST" 2>/dev/null)" ]; then
            mkdir -p "$DST"; cp -a "$SRC"/. "$DST"/; rm -rf "$SRC"
          else
            mv "$SRC" "$SRC.bak-$TS"
          fi
        fi
        ln -s "$DST" "$SRC"
      }
      migrate_or_link "$HOME/.config/herdr"            "/data/herdr-config"
      migrate_or_link "$HOME/.config/code-server"      "/data/code-server/config"
      migrate_or_link "$HOME/.local/share/code-server" "/data/code-server/share"
      # opencode CONFIG persistence (mirrors the herdr pattern). Ordering is
      # critical and satisfied here: dotfiles/setup.sh has ALREADY run above
      # (step 4, "bash $HOME/dotfiles/setup.sh"), so on first boot it has copied
      # the committed opencode config into ~/.config/opencode; migrate_or_link
      # now moves that onto /data/opencode-config and symlinks it back. On every
      # subsequent rebuild /data already holds the live config (incl. any on-box
      # edits), so the user's opencode state survives. NOTE: the opencode BINARY
      # (installed via curl opencode.ai/install above) stays ephemeral/self-
      # updating on the OS disk — only the CONFIG needs to live on /data.
      migrate_or_link "$HOME/.config/opencode"         "/data/opencode-config"
      # Re-assert the handoff-on-context plugin AFTER the config migrate. Why:
      # on a rebuild with an existing /data volume, migrate_or_link keeps the
      # /data config (setup.sh's fresh tree is bak'd), so a plugin symlink
      # pointing at the EPHEMERAL $HOME/codebase clone would dangle — and a
      # stale symlink would also miss fixes pushed to the plugin repo. Pin the
      # symlink to the persistent clone under /data/codebase (survives
      # destroy), cloning/pulling it here so this works even if setup.sh's
      # handoff block was skipped or failed. ~/.config/opencode is now a
      # symlink to /data/opencode-config, so linking under /data covers both.
      HANDOFF_REPO="/data/codebase/opencode-handoff-on-context"
      if [ ! -f "$HANDOFF_REPO/index.js" ]; then
        mkdir -p /data/codebase
        git clone git@github.com:simranjeetc/opencode-handoff-on-context.git "$HANDOFF_REPO" \
          || HANDOFF_REPO="$HOME/codebase/simranjeetc/opencode-handoff-on-context"
      fi
      if [ -d "$HANDOFF_REPO/.git" ]; then
        git -C "$HANDOFF_REPO" pull --ff-only || true
      fi
      if [ -f "$HANDOFF_REPO/index.js" ]; then
        mkdir -p /data/opencode-config/plugins
        ln -sfn "$HANDOFF_REPO/index.js" /data/opencode-config/plugins/handoff-on-context.js
      fi
      # opencode AUTH + local state persistence. Unlike ~/.config/opencode (settings),
      # auth.json (provider credentials / opencode-go login), opencode.db (chat
      # history), mcp-auth.json, and snapshots live under ~/.local/share/opencode.
      # That dir is NOT covered by the config symlink above, so without this it sits
      # on the ephemeral OS disk and is wiped on every dev-down/dev-up — the user
      # "loses their key" after a rebuild. Persist it onto /data like the rest.
      migrate_or_link "$HOME/.local/share/opencode"    "/data/opencode-share"
      # Seed the opencode version pin on /data (idempotent). On a truly-fresh
      # /data this writes the last-known-good default so future rebuilds read a
      # deterministic pin at install time (line ~254). NEVER clobber an existing
      # pin: the user bumps it deliberately after a smoke-tested upgrade (see
      # RECOVERY.md). /data/opencode-config exists here (migrate_or_link created
      # or symlinked it above).
      mkdir -p /data/opencode-config
      [ -f /data/opencode-config/OPENCODE_VERSION ] || echo "1.18.6" > /data/opencode-config/OPENCODE_VERSION
      # Seed the Claude Code channel/version pin on /data (idempotent; same
      # rationale as the opencode pin directly above). /data/claude-config
      # already exists (created by the root section earlier in this script) and
      # is where $CLAUDE_CONFIG_DIR already points, so no migrate_or_link is
      # needed here — Claude Code writes its own config/credentials/session
      # history straight into it.
      [ -f /data/claude-config/CLAUDE_CODE_VERSION ] || echo "stable" > /data/claude-config/CLAUDE_CODE_VERSION
      chmod 700 /data/herdr-config
      chmod 600 /data/code-server/config/config.yaml 2>/dev/null || true
      for RC in "$HOME/.bashrc" "$HOME/.zshrc"; do
        grep -q ".opencode/bin" "$RC" 2>/dev/null || \
          echo 'export PATH=$PATH:$HOME/.opencode/bin:$HOME/.local/bin:/usr/local/go/bin:$HOME/go/bin' >> "$RC"
        grep -q "CLAUDE_CONFIG_DIR" "$RC" 2>/dev/null || \
          echo 'export CLAUDE_CONFIG_DIR=/data/claude-config' >> "$RC"
      done

      DEVEOF

      # --- Default shell for dev -> zsh (needs root; dotfiles applied above). ---
      # Idempotent: chsh is a no-op if already zsh. /usr/bin/zsh from the zsh pkg.
      if [ "$(getent passwd dev | cut -d: -f7)" != "/usr/bin/zsh" ]; then
        chsh -s /usr/bin/zsh dev
      fi

      # Allow dev's systemd --user services (e.g. on-demand code-server) to run
      # without an active login session — needed for tablet/SSH use. This does
      # NOT enable code-server at boot; it only lets `systemctl --user start`
      # work over a plain SSH session.
      loginctl enable-linger dev

      # Global toolchain env: sourced by ALL login shells (interactive OR not),
      # e.g. `ssh host "cmd"`, opencode subprocesses, build scripts. Fixes the
      # ~/.bashrc non-interactive-guard problem where java/node were invisible.
      cat > /etc/profile.d/00-dev-toolchains.sh <<'PROFEOF'
      export SDKMAN_DIR="/home/dev/.sdkman"
      [ -s "$SDKMAN_DIR/bin/sdkman-init.sh" ] && source "$SDKMAN_DIR/bin/sdkman-init.sh"
      export NVM_DIR="/home/dev/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && source "$NVM_DIR/nvm.sh"
      export PATH="/home/dev/.local/bin:/home/dev/.opencode/bin:/usr/local/go/bin:/home/dev/go/bin:$PATH"
      PROFEOF
      chmod 644 /etc/profile.d/00-dev-toolchains.sh

      touch /home/dev/.provision-complete
      chown dev:dev /home/dev/.provision-complete

runcmd:
  - systemctl restart ssh
  - ufw allow OpenSSH
  - ufw allow 8443/tcp
  # Tailscale: permit everything arriving on the tailscale interface (Tailscale
  # SSH, the tailscale-serve HTTPS proxy, plain 100.x traffic). The rule is
  # registered before the interface exists — ufw applies it once tailscale0
  # appears (provision.sh brings it up).
  - ufw allow in on tailscale0
  # WireGuard direct connections (better latency than DERP relay); the tailnet
  # still functions without it via outbound-only DERP.
  - ufw allow 41641/udp
  - ufw --force enable
  - systemctl enable --now fail2ban
  - bash /opt/provision.sh 2>&1 | tee /var/log/provision.log

final_message: "Cloud dev box ready. Provision log: /var/log/provision.log. Marker: /home/dev/.provision-complete"
